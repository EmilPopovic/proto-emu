name: regression

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Run verification and lint, reporting failures from both.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Regression
        run: |
          nix develop --accept-flake-config --command \
            make -C . -k regression

      # regression builds the file as part of regression-tinytapeout. Upload it
      # even when an earlier target failed, since lint is currently expected to.
      - name: Upload Tiny Tapeout Verilog
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tt_um_proto_emu-${{ github.sha }}
          path: target/tinytapeout/build/tt_um_proto_emu.v
          if-no-files-found: error
