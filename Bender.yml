package:
  name: proto-emu
  description: "A programmable protocol emulator"
  authors:
    - "Emil Popovic <mail@emilpopovic.me>"
    - "Matej Jurasic <matej.jurasic@cappig.dev>"

sources:
  - target: not(any(uart_test, strobe_test))
    files:
      # Core modules
      - rtl/core/proto_emu_pkg.sv
      - rtl/core/proto_emu.sv
  - target: not(uart_test)
    files:
      # High-speed host link PHYs
      - rtl/host_link/strobe_rx.sv
      - rtl/host_link/strobe_tx.sv
  - target: not(strobe_test)
    files:
      - rtl/host_link/uart_rx.sv
      - rtl/host_link/uart_tx.sv
  - target: not(any(uart_test, strobe_test))
    files:
      - rtl/host_link/proto_emu_top.sv
  - target: uart_test
    files:
      - verif/uart/uart_case.sv
      - verif/uart/uart_tb.sv
  - target: all(strobe_test, not(synthesis))
    files:
      - verif/strobe/strobe_case.sv
      - verif/strobe/strobe_tb.sv
